name: build-proxy-dll

on:
  push:
  workflow_dispatch:   # allows manual "Run workflow" button

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build steam_api64.dll (proxy)
        shell: cmd
        run: cl /nologo /LD /O2 /EHsc /MT /std:c++17 dllmain.cpp /link /OUT:steam_api64.dll

      - name: Upload built DLL
        uses: actions/upload-artifact@v4
        with:
          name: steam_api64-proxy
          path: steam_api64.dll
          if-no-files-found: error
